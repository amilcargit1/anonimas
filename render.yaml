services:
  - type: web
    name: confesiones-app
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: confesiones-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: confesiones-db
    plan: free
